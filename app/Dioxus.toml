[application]
name = "FFmpeg Video Studio"
# The installer is generated straight into main/release (relative to this crate), not left nine
# folders deep under target/.
out_dir = "../release"

[bundle]
identifier = "com.yaiol.ffmpeg-video-studio.app"
publisher = "yaiol"
icon = ["assets/app.png", "assets/app.ico", "assets/app.icns"]
short_description = "A Studio to cut and grade one video and see each effect, and a Batch to convert many files at once. ffmpeg is the engine."

# Skip: the installer does not touch WebView2. dx's script runs Microsoft's bootstrapper on EVERY
# install, with no check for an installed runtime - about a minute, for nothing, on a machine that
# has it (every Windows 11). Revisit before a Rust app is distributed: a Windows 10 machine without
# the runtime would then start the app to nothing.
[bundle.windows]
webview_install_mode = "Skip"

# `template` is our installer script (display name "yaiol <name>", an icon in Settings > Apps, the
# shared Start Menu folder left alone on uninstall) - see installer.nsi. `installer_icon` is also the
# icon that script copies next to the executable for the uninstall entry.
[bundle.windows.nsis]
install_mode = "Both"
start_menu_folder = "yaiol"
installer_icon = "assets/app.ico"
template = "installer.nsi"
